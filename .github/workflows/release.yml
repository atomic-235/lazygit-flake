name: Release

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and publish even if the pinned version matches"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - name: Resolve latest upstream version
        id: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/jesseduffield/lazygit/releases/latest | jq -r .tag_name)"
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compare with pinned version
        id: check
        run: |
          current="$(jq -r .version version.json)"
          echo "pinned=${current}" >> "$GITHUB_OUTPUT"
          if [ "$current" = "${{ steps.latest.outputs.version }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static binary
        id: build
        if: steps.check.outputs.new == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          src_hash="$(nix store prefetch-file --json --unpack \
            "https://github.com/jesseduffield/lazygit/archive/refs/tags/v${VERSION}.tar.gz" | jq -r .hash)"
          jq --arg v "$VERSION" --arg h "$src_hash" \
            '.version = $v | .srcHash = $h' version.json > version.json.tmp
          mv version.json.tmp version.json

          out="$(nix build --no-link --print-out-paths '.#static^out')"
          cp "$out/bin/lazygit" lazygit-linux-x86_64
          bin_sha="$(nix hash file --type sha256 --sri lazygit-linux-x86_64)"

          jq --arg s "$bin_sha" '.assets["x86_64-linux"] = $s' version.json > version.json.tmp
          mv version.json.tmp version.json
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        if: steps.build.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "lazygit ${VERSION}" \
              --notes "Static lazygit ${VERSION} without donate/ask-question links."
          fi
          gh release upload "v${VERSION}" lazygit-linux-x86_64 --clobber

      # The published asset must satisfy the flake's fixed-output check before
      # the commit points consumers at it.
      - name: Verify the flake can consume the asset
        if: steps.build.outputs.publish == 'true'
        run: nix build --no-link .#default

      - name: Commit and tag
        if: steps.build.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add version.json flake.lock
          if ! git diff --cached --quiet; then
            git commit -m "release: lazygit ${VERSION}"
            git push origin HEAD:main
          fi
          git tag -f "v${VERSION}"
          git tag -f latest
          git push --force origin "v${VERSION}" latest

      - name: Open issue when the patch no longer applies
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          gh issue create \
            --title "lazygit ${VERSION}: build failed" \
            --body "The release build for lazygit ${VERSION} failed, most likely because remove-donate-links.patch no longer applies. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
